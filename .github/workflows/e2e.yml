name: E2E Tests (Playwright + pytest)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fast_test
          POSTGRES_PASSWORD: fast_test
          POSTGRES_DB: fast_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fast_test -d fast_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://fast_test:fast_test@localhost:5432/fast_test
      DIRECT_URL: postgresql://fast_test:fast_test@localhost:5432/fast_test
      AUTH_SECRET: e2e-test-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: Fast
      UPSTASH_REDIS_REST_URL: ""
      UPSTASH_REDIS_REST_TOKEN: ""
      EMAIL_HOST: ""
      EMAIL_PORT: "587"
      EMAIL_USER: ""
      EMAIL_PASSWORD: ""
      EMAIL_FROM: "Fast <noreply@example.com>"
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: test
      NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: test
      CLOUDINARY_API_KEY: test
      CLOUDINARY_API_SECRET: test
      NEXT_PUBLIC_PLATFORM_BANK_INFO: "Test Bank - 0123456789 - NGUYEN VAN TEST"
      NEXT_PUBLIC_PLATFORM_QR_URL: ""
      CRON_SECRET: e2e-test-cron-secret
      PLAYWRIGHT_BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: e2e/requirements.txt

      - name: Install Python test dependencies
        run: pip install -r e2e/requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Apply DB migrations
        run: npx prisma migrate deploy

      - name: Seed test DB
        run: npx prisma db seed

      - name: Build app
        run: npm run build

      - name: Run E2E tests
        env:
          E2E_SKIP_SERVER_START: "0"
        run: python -m pytest e2e/tests -v

      - name: Upload Playwright traces/screenshots/videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/e2e-artifacts
          retention-days: 7
